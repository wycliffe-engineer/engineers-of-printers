<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineers of Printers</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172554;font:16px system-ui,Arial}header{background:#1d4ed8;color:#fff;padding:20px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header h1{margin:0;font-size:1.4rem}header p{margin:3px 0;color:#dbeafe}.wrap{max-width:1100px;margin:22px auto;padding:0 16px}.notice{padding:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;border:1px solid #dbeafe;border-radius:12px;padding:17px}.metric{font-size:2rem;font-weight:700;color:#1d4ed8}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,button{background:#1d4ed8;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.tabs button.active{background:#1e3a8a}section{display:none}section.active{display:block}label{display:block;margin:10px 0 4px;font-size:.9rem}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}form{max-width:650px}table{width:100%;border-collapse:collapse;margin-top:12px;display:block;overflow:auto}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2e8f0;white-space:nowrap}.muted{color:#64748b}.msg{margin:10px 0}.good{color:#15803d}.bad{color:#b91c1c}</style></head><body><header><div><h1>Engineers of Printers</h1><p>Printer Repair & Services Management System</p></div><div>Kakamega · Kenya</div></header><main class="wrap"><div class="notice" id="notice">Checking connection to online database…</div><div class="cards"><div class="card">Customers<div class="metric" id="customersCount">—</div></div><div class="card">Repair jobs<div class="metric" id="jobsCount">—</div></div><div class="card">Pending jobs<div class="metric" id="pendingCount">—</div></div></div><nav class="tabs"><button class="active" data-tab="jobs">Repair Jobs</button><button data-tab="customers">Customers</button></nav>
<section class="active card" id="jobs"><h2>Register repair job</h2><form id="jobForm"><label>Customer</label><select name="customer_id" id="customerSelect" required><option value="">Load/add customer first</option></select><label>Printer brand</label><input name="printer_brand" required placeholder="HP, Canon, Epson…"><label>Printer model</label><input name="printer_model"><label>Serial number</label><input name="serial_number"><label>Problem reported</label><textarea name="problem_reported" rows="3" required></textarea><label>Diagnosis</label><textarea name="diagnosis" rows="2"></textarea><label>Repair notes</label><textarea name="repair_notes" rows="2"></textarea><label>Estimated cost (KES)</label><input name="estimated_cost" type="number" min="0" step=".01" value="0"><label>Status</label><select name="status"><option>Received</option><option>Diagnosing</option><option>Waiting for parts</option><option>In repair</option><option>Completed</option><option>Collected</option></select><button type="submit" style="margin-top:14px">Save repair job</button><div class="msg" id="jobMsg"></div></form><h3>Repair jobs</h3><div id="jobsTable" class="muted">Loading…</div></section>
<section class="card" id="customers"><h2>Add customer</h2><form id="customerForm"><label>Full name</label><input name="full_name" required><label>Phone</label><input name="phone" required><label>Email (optional)</label><input name="email" type="email"><label>Location (optional)</label><input name="location"><button type="submit" style="margin-top:14px">Save customer</button><div class="msg" id="customerMsg"></div></form><h3>Customer list</h3><div id="customerTable" class="muted">Loading…</div></section><footer class="muted" style="padding:24px 0">Engineers of Printers · KES · Online database</footer></main><script>
const $=s=>document.querySelector(s);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
async function api(url,opts={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({error:'Server returned a non-JSON response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function table(items,cols){if(!items.length)return '<p>No records yet.</p>';return '<table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+items.map(o=>'<tr>'+cols.map(c=>'<td>'+esc(o[c[0]]??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{let [cs,js]=await Promise.all([api('/api/customers'),api('/api/jobs')]);$('#notice').textContent='Connected to the online D1 database. Records are saved online.';$('#notice').className='notice good';$('#customersCount').textContent=cs.length;$('#jobsCount').textContent=js.length;$('#pendingCount').textContent=js.filter(j=>!['Completed','Collected'].includes(j.status)).length;$('#customerSelect').innerHTML='<option value="">Choose customer</option>'+cs.map(c=>`<option value="${c.id}">${esc(c.full_name)} — ${esc(c.phone)}</option>`).join('');$('#customerTable').innerHTML=table(cs,[['full_name','Name'],['phone','Phone'],['email','Email'],['location','Location']]);$('#jobsTable').innerHTML=table(js,[['job_number','Job #'],['customer_name','Customer'],['printer_brand','Brand'],['printer_model','Model'],['problem_reported','Problem'],['status','Status'],['estimated_cost','Est. KES']])}catch(e){$('#notice').textContent='Database/API connection not ready: '+e.message;$('#notice').className='notice bad';$('#customersCount').textContent='0';$('#jobsCount').textContent='0';$('#pendingCount').textContent='0'}}
$('#customerForm').onsubmit=async e=>{e.preventDefault();let msg=$('#customerMsg');try{await api('/api/customers',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});msg.textContent='Customer saved.';msg.className='msg good';e.target.reset();await load()}catch(x){msg.textContent=x.message;msg.className='msg bad'}};
$('#jobForm').onsubmit=async e=>{e.preventDefault();let msg=$('#jobMsg');let d=Object.fromEntries(new FormData(e.target));d.estimated_cost=Number(d.estimated_cost||0);try{let res=await api('/api/jobs',{method:'POST',body:JSON.stringify(d)});msg.textContent='Repair job saved: '+res.job_number;msg.className='msg good';e.target.reset();await load()}catch(x){msg.textContent=x.message;msg.className='msg bad'}};load();
</script></body></html>
